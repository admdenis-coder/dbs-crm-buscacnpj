services:
  crm:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DBS_PUBLIC_ORIGIN: https://${CRM_DOMAIN:?Configure CRM_DOMAIN}
      DBS_GATEWAY_TOKEN: ${DBS_GATEWAY_TOKEN:?Configure DBS_GATEWAY_TOKEN}
      DBS_DATA_DIR: /data
    volumes:
      - crm_data:/data
    # No public application port: all traffic passes through authenticated HTTPS.
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-m", "dbs_crm.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      crm:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Configure CRM_DOMAIN}
      CRM_USERNAME: ${CRM_USERNAME:?Configure CRM_USERNAME}
      CRM_PASSWORD_HASH: ${CRM_PASSWORD_HASH:?Configure CRM_PASSWORD_HASH}
      DBS_GATEWAY_TOKEN: ${DBS_GATEWAY_TOKEN:?Configure DBS_GATEWAY_TOKEN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  crm_data:
  caddy_data:
  caddy_config:
